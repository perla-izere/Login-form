<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Login – feature/izere</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: system-ui, sans-serif;
      background: #f3f4f6;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .login-card {
      background: #ffffff;
      border: 1px solid #e5e7eb;
      border-radius: 12px;
      padding: 2rem 2.25rem;
      width: 100%;
      max-width: 360px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 1.75rem;
    }

    .brand-icon {
      width: 36px;
      height: 36px;
      border-radius: 10px;
      background: #eff6ff;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #3b82f6;
      font-size: 18px;
    }

    .brand h2 {
      font-size: 17px;
      font-weight: 500;
      color: #111827;
    }

    .field {
      margin-bottom: 1rem;
    }

    .field label {
      display: block;
      font-size: 13px;
      color: #6b7280;
      margin-bottom: 6px;
    }

    .field input {
      width: 100%;
      padding: 0 12px;
      height: 38px;
      background: #f9fafb;
      border: 1px solid #e5e7eb;
      border-radius: 8px;
      font-size: 14px;
      color: #111827;
      outline: none;
      transition: border-color 0.15s;
    }

    .field input:focus {
      border-color: #9ca3af;
    }

    /* Button + Tooltip */
    .btn-wrap {
      margin-top: 1.5rem;
      position: relative;
      display: inline-block;
      width: 100%;
    }

    .tooltip {
      position: absolute;
      bottom: calc(100% + 8px);
      left: 50%;
      transform: translateX(-50%) translateY(4px);
      background: #ffffff;
      border: 1px solid #d1d5db;
      border-radius: 8px;
      padding: 6px 12px;
      font-size: 12px;
      color: #6b7280;
      white-space: nowrap;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.15s, transform 0.15s;
      z-index: 10;
    }

    .tooltip::after {
      content: '';
      position: absolute;
      top: 100%;
      left: 50%;
      transform: translateX(-50%);
      border: 5px solid transparent;
      border-top-color: #d1d5db;
    }

    /* Show tooltip on hover */
    .btn-wrap:hover .tooltip {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    .login-btn {
      width: 100%;
      height: 38px;
      background: #ffffff;
      border: 1px solid #d1d5db;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 500;
      color: #111827;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: background 0.15s, transform 0.1s;
    }

    .login-btn:hover {
      background: #f9fafb;
    }

    .login-btn:active {
      transform: scale(0.98);
    }

    .branch-tag {
      margin-top: 1.5rem;
      text-align: center;
      font-size: 11px;
      color: #9ca3af;
    }

    .branch-tag code {
      background: #f3f4f6;
      border: 1px solid #e5e7eb;
      border-radius: 4px;
      padding: 2px 7px;
      font-family: monospace;
      font-size: 11px;
    }
  </style>
</head>
<body>

  <div class="login-card">
    <div class="brand">
      <div class="brand-icon"><i class="ti ti-lock"></i></div>
      <h2>Sign in</h2>
    </div>

    <div class="field">
      <label for="username">Username</label>
      <input type="text" id="username" placeholder="Enter your username" autocomplete="username" />
    </div>

    <div class="field">
      <label for="password">Password</label>
      <input type="password" id="password" placeholder="Enter your password" autocomplete="current-password" />
    </div>

    <div class="btn-wrap">
      <div class="tooltip">Click to sign in</div>
      <button class="login-btn" type="button">
        <i class="ti ti-arrow-right"></i>
        Login
      </button>
    </div>

    <p class="branch-tag">branch: <code>feature/izere</code></p>
  </div>

</body>
</html>
